        - "4. Systems Architecture & Design (60m): Large-scale distributed edge design (e.g. edge proxy caching, DDoS mitigation, rate limiting, consistency models)."
        - "5. Culture & Values ('Cloudflare Capabilities') (45m): Cross-functional collaboration, handling ambiguity, learning mindset."

