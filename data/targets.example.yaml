# Example target companies: one per supported ATS, to show the format.
# Do NOT edit this file for your own search. Build your own list in data/targets.local.yaml
# (git-ignored), e.g. by feeding your CV to an LLM with the prompt in README "Personalize".
#
# Fields:
#   tier: big_tech | enterprise_infra | scaleup
#   ats: greenhouse | lever | ashby | workday | smartrecruiters | recruitee | workable | deel
#        | scraper (board = scraper_id) | amazon | dynatrace | proxmox | sidero
#   board: ATS board identifier (workday also needs site, sub_domain, optional search_text)
#   entity_in_home_country: company has a legal entity in YOUR country (+score)
#   eor_supported: company hires via Employer of Record (+score)
#   allowed_countries: optional extra countries accepted for this company only

companies:
  - id: gitlab
    name: "GitLab"
    tier: enterprise_infra
    category: "DevOps & Cloud Infra"
    ats: greenhouse
    board: gitlab
    entity_in_home_country: false
    eor_supported: true
    notes: "All-remote. Go/Ruby, CI/CD, Gitaly."

