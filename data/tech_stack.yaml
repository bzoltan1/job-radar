# Tracked technologies for technical role filtering, scoring bonuses, and tagging.
# Customize this file or copy it to data/tech_stack.local.yaml for private overrides.
#
# Each entry can be:
#   - a simple string: "rust", "python", "kubernetes"
#   - or an item with 'name' and explicit regex 'pattern':
#       name: "golang"
#       pattern: "\\b(golang|go)\\b"

tech_stack:
  - name: "golang"
    pattern: "\\b(golang|go)\\b"
  - name: "c"
    pattern: "\\bc\\b"
  - name: "c++"
    pattern: "\\bc\\+\\+"
  - name: "rust"
    pattern: "\\brust\\b"
  - name: "python"
    pattern: "\\bpython\\b"
  - name: "crystal"
    pattern: "\\bcrystal\\b"
  - name: "cloud"
    pattern: "\\bcloud\\b"
  - name: "aws"
    pattern: "\\baws\\b"
  - name: "azure"
    pattern: "\\bazure\\b"
  - name: "openstack"
    pattern: "\\bopenstack\\b"
  - name: "ansible"
    pattern: "\\bansible\\b"
  - name: "linux"
    pattern: "\\blinux\\b"
  - name: "ebpf"
    pattern: "\\bebpf\\b"
  - name: "systemd"
    pattern: "\\bsystemd\\b"
  - name: "kernel"
    pattern: "\\bkernel\\b"
  - name: "kubernetes"
    pattern: "\\bkubernetes\\b"
  - name: "docker"
    pattern: "\\bdocker\\b"
  - name: "podman"
    pattern: "\\bpodman\\b"
  - name: "kvm"
    pattern: "\\bkvm\\b"
  - name: "qemu"
    pattern: "\\bqemu\\b"
  - name: "perf"
    pattern: "\\bperf\\b"
  - name: "syscall"
    pattern: "\\bsyscall\\b"
  - name: "posix"
    pattern: "\\bposix\\b"
