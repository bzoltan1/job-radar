# Example Tech Stack Configuration for Job Radar
# Copy this file to data/tech_stack.local.yaml and customize with your tracked technologies.

tech_stack:
  # "go" and "c" are English words: plain `go` / `c` entries (no pattern) use a built-in
  # case-sensitive, list-context pattern. Prefer them over a hand-written \bgo\b.
  - go
  - c
  - name: "c++"
    pattern: "\\bc\\+\\+"
  - name: "rust"
    pattern: "\\brust\\b"
  - name: "python"
    pattern: "\\bpython\\b"
  - name: "cloud"
    pattern: "\\bcloud\\b"
  - name: "aws"
    pattern: "\\baws\\b"
  - name: "azure"
    pattern: "\\bazure\\b"
  - name: "openstack"
    pattern: "\\bopenstack\\b"
  - name: "ansible"
    pattern: "\\bansible\\b"
  - name: "linux"
    pattern: "\\blinux\\b"
  - name: "ebpf"
    pattern: "\\bebpf\\b"
  - name: "systemd"
    pattern: "\\bsystemd\\b"
  - name: "kernel"
    pattern: "\\bkernel\\b"
  - name: "kubernetes"
    pattern: "\\bkubernetes\\b"
  - name: "docker"
    pattern: "\\bdocker\\b"
  - name: "podman"
    pattern: "\\bpodman\\b"
  - name: "kvm"
    pattern: "\\bkvm\\b"
  - name: "qemu"
    pattern: "\\bqemu\\b"
  - name: "perf"
    pattern: "\\bperf\\b"
  - name: "syscall"
    pattern: "\\bsyscall\\b"
  - name: "posix"
    pattern: "\\bposix\\b"
