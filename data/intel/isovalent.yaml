culture_and_wlb:
  summary: Original creators of Cilium and pioneers of Linux kernel eBPF for networking,
    observability, and security. Acquired by Cisco in 2024 to power Hypershield and
    cloud-native security. World-class Linux kernel and Go systems engineering culture.
  pros:
  - Definitive industry leaders in eBPF, Cilium, and Linux kernel networking
  - Strong open-source core engineering ethos backed by Cisco enterprise stability
  - Excellent compensation, benefits, and work-life balance
  cons:
  - Post-acquisition integration with enterprise corporate processes
  - Large-scale coordination across global Cisco business units
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background, experience with Linux networking/distributed systems, compensation.'
  - '2. Technical Coding Screen (60m): Systems programming in Go or C/C++, concurrent systems, data structures.'
  - '3. Systems & eBPF Deep Dive (60m): Linux kernel networking, eBPF bytecode/verifier, CNI, packet processing.'
  - '4. System Design & Architecture (60m): Scalable cloud-native networking, service mesh, security enforcement.'
  - '5. Leadership & Team Alignment: Open source collaboration, engineering philosophy, and cross-team culture.'
