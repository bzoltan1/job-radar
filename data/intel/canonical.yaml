name: Canonical
tier: Enterprise Infrastructure
glassdoor_rating: 3.9
recommend_to_friend: 74%
ceo_approval: 78%
italy_legal_entity: 'Canonical Ltd (hiring via EOR in Italy: full employee contract)'
contract_type: Permanent Local Contract via EOR
remote_policy: 100% Remote / Home-Based Worldwide
emea_staff_comp_range: €80,000 - €130,000 (standardized leveling)
culture_and_wlb:
  summary: 100% remote since inception. Twice-yearly in-person team sprints in global
    destinations. Heavy written documentation, strict leveling, and structured performance
    reviews.
  pros:
  - Pure Linux distribution and open-source mission
  - True remote autonomy with global reach
  - Twice-yearly paid in-person team sprints
  cons:
  - Intense, high-volume interview assessment process
  - Strict hierarchy and performance review cycles
interview_process:
  stages:
  - '1. Written Application & Essay Questions: Canonical requires extensive written
    answers regarding high-school achievements, university performance, and career
    milestones.'
  - '2. Standardized Psychometric & Aptitude Testing (Thomas International GIA): Speed,
    reasoning, numerical, and spatial assessments.'
  - '3. Technical Interview (60m): Linux platform engineering, packaging, kernel integration,
    debugging.'
  - '4. Engineering Leadership / Peer Panel (60m): Architecture, open source community
    interaction, distributed systems.'
  - '5. Executive / Mark Shuttleworth Final Interview (30-45m): Vision, intellectual
    curiosity, cultural alignment.'
