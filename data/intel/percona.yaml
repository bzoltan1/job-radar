name: Percona
tier: Enterprise Infra / Open Source DB
glassdoor_rating: 4.5
recommend_to_friend: 89%
ceo_approval: 93%
home_legal_entity: None (hiring in Europe via EOR / Deel)
contract_type: Permanent European Employee Contract via EOR
remote_policy: 100% Remote-First (All-remote pioneer since 2006)
emea_staff_comp_range: €95,000 - €155,000 + Bonus
culture_and_wlb:
  summary: Global leader in enterprise open-source database software and telemetry
    tooling (PMM, Percona Server for MySQL/PostgreSQL/MongoDB). Mature asynchronous
    culture, worldwide distributed team across 50+ countries, high autonomy, deep
    Linux performance tuning.
  pros:
  - True all-remote pioneer with zero office politics
  - Deep technical focus on database internals, Linux kernel I/O, and query optimization
  - Strong work-life balance and supportive engineering culture
  cons:
  - Enterprise support obligations require disciplined on-call shifts
  - Public cloud database competition requires ongoing product modernization
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background, remote workflow, compensation alignment.'
  - '2. Technical Screen (60m): Linux systems, database internals, concurrency in
    Go or C/C++.'
  - '3. Systems Design & Troubleshooting (60m): High-availability clusters, replication
    lag, memory bottlenecks.'
  - '4. Engineering Management & Culture Fit: Team collaboration and remote communication.'
