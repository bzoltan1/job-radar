name: Amazon Web Services (AWS)
tier: Big Tech
glassdoor_rating: 3.9
recommend_to_friend: 74%
ceo_approval: 82%
italy_legal_entity: Amazon Italia Services S.r.l. / AWS Italy S.r.l. (Milan & Asti)
contract_type: Permanent Italian Contract (CCNL Terziario / Commercio)
remote_policy: Hybrid / Remote in Italy / Europe depending on team
emea_staff_comp_range: €120,000 - €220,000 + RSU Equity
culture_and_wlb:
  summary: Cloud market leader with world-class operating systems and virtualization
    teams (Bottlerocket, Amazon Linux, Firecracker, NICE DCV in Asti). Document-driven
    culture (6-page narratives) and rigorous Leadership Principles.
  pros:
  - Top compensation with liquid stock grants
  - Work on hyper-scale infrastructure impacting millions of servers
  - Italian legal presence with Milan office and Asti DCV graphics/streaming lab
  cons:
  - Leadership Principles rigorously tested in reviews and interviews
  - Scale of operations can involve bureaucratic sign-offs
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background, role alignment, expectations.'
  - '2. Technical Phone Screen (60m): Coding and fundamental OS/networking questions.'
  - '3. Virtual Onsite Loop (5 rounds x 60m):'
  - '   - Coding & Data Structures (2 rounds): Clean, maintainable implementation
    in Go, Rust, or C.'
  - '   - Systems & Architecture (1 round): Low-level OS architecture, kernel/container
    boundaries, distributed design.'
  - '   - Leadership Principles & Behavioral (2 rounds + Bar Raiser): Deep dive into
    customer obsession, ownership, and deliver results.'
