culture_and_wlb:
  summary: Global document database leader. Distributed systems, storage engines (WiredTiger
    in C/C++), cloud infrastructure (Atlas in Go). Excellent developer benefits and
    progressive remote policy.
  pros:
  - Top-tier compensation, high stock liquidity
  - World-class distributed systems and database internals team
  - Direct Italian entity
  cons:
  - Fast growth creates frequent organizational changes
  - Cross-timezone coordination with US West/East
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Fit, location, compensation.'
  - '2. Technical Screen (60m): Coding and systems problem solving (C++ or Go).'
  - '3. Virtual Onsite (4 rounds x 60m):'
  - '   - Systems Programming: Concurrency, memory models, process lifecycle.'
  - '   - Distributed Systems: Replication, consensus (Raft/Paxos), partitioning.'
  - '   - Practical Coding: Clean, idiomatic Go/C++ implementation.'
  - '   - Leadership & Collaboration: Working across diverse international teams.'
