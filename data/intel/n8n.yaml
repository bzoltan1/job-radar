name: n8n
tier: Scaleup / Workflow Automation
glassdoor_rating: 4.6
recommend_to_friend: 92%
ceo_approval: 96%
italy_legal_entity: n8n GmbH (Berlin, Germany; hiring across Europe via direct contract
  / EOR)
contract_type: Permanent European Contract (German contract or EOR)
remote_policy: Remote-First in Europe (Berlin office available)
emea_staff_comp_range: €90,000 - €150,000 + Stock Options
culture_and_wlb:
  summary: Leading fair-code workflow automation platform. High-velocity developer
    adoption, transparent community, strong product-led growth, modern TypeScript/Node.js,
    Docker/Kubernetes self-hosted and cloud infrastructure.
  pros:
  - Vibrant open-source/fair-code project loved by technical developers
  - Fast-growing scaleup with high autonomy and modern tech stack
  - Supportive European remote engineering team
  cons:
  - Rapid growth brings frequent architectural refactoring
  - Balancing self-hosted community demands with managed cloud SLAs
interview_process:
  stages:
  - '1. Recruiter Chat (30m): Background, interests, remote workflow.'
  - '2. Technical Pairing / Practical Task (60m): Code architecture, debugging, systems
    logic.'
  - '3. Infrastructure & Scalability Design (60m): High-throughput queueing, worker
    execution, container sandboxing.'
  - '4. Founders & Values Alignment: Collaborative spirit and engineering standards.'
