name: Backblaze
tier: Enterprise Infra / Cloud Storage
glassdoor_rating: 4.0
recommend_to_friend: 78%
ceo_approval: 84%
italy_legal_entity: Backblaze Netherlands B.V. (EU DC footprint; international hires
  via contractor/EOR)
contract_type: Permanent European Contract via EOR or Defined Contractor Agreement
remote_policy: Remote-First (US, LATAM, and European data center operations)
emea_staff_comp_range: €100,000 - €160,000 + Equity
culture_and_wlb:
  summary: Pioneers of affordable cloud storage (B2) and open-source Storage Pod hardware
    design. Deep low-level Linux systems, storage engineering, drive stats analytics,
    and high-density datacenter infrastructure.
  pros:
  - Transparent culture famous for open-sourcing Storage Pod hardware designs and
    HDD reliability data
  - Massive storage scale (exabytes under management on Linux)
  - Remote-first engineering culture with pragmatic technology choices
  cons:
  - Requisitions strictly geo-fenced per role (US, LATAM, or Europe DC)
  - Public company operating in a competitive cloud storage commodity market
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background, remote setup, and compensation alignment.'
  - '2. Technical Screening (60m): Coding and systems fundamentals in Go, Python,
    Java, or C/C++.'
  - '3. Virtual Onsite Loop (3-4 rounds): Storage systems design, high-availability
    architecture, failure domains, and practical debugging.'
  - '4. Leadership & Culture Fit: Cross-functional collaboration and pragmatic problem
    solving.'
