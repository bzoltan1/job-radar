recommend_to_friend: 87%
ceo_approval: 91%
home_legal_entity: Red Hat Italy S.r.l. (Milan & Rome)
contract_type: Permanent Italian Contract (CCNL Metalmeccanico)
remote_policy: Remote-First in Italy
emea_staff_comp_range: €90,000 - €140,000 + Bonus + IBM Equity
culture_and_wlb:
  summary: The definitive open source enterprise powerhouse. 'Open Decision Framework'
    culture. Outstanding work-life balance, high psychological safety, and deep open-source
    contributions.
  pros:
  - Premier enterprise Linux distribution with deep open-source heritage
  - Superb work-life balance and benefits
  - Full employee contract with strong Italian subsidiary
  cons:
  - IBM corporate integrations can slow down administrative processes
  - Slightly more conservative compensation compared to pure Silicon Valley peers
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Logistics, team alignment, compensation expectations.'
  - '2. Hiring Manager Technical Chat (45m): Past experience, open source contributions,
    team dynamic.'
  - '3. Technical Deep Dive / Pair Programming (60-90m): Real-world troubleshooting,
    scripting, Linux platform diagnosis.'
  - '4. Systems Architecture & Open Source Philosophy (60m): Upstream-first workflow,
    Linux distribution packaging, enterprise lifecycle.'
  - '5. Culture & Team Fit (45m): Open culture, collaboration across global timezones.'
