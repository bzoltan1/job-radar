name: Cloudflare
tier: Big Tech
glassdoor_rating: 4.1
recommend_to_friend: 81%
ceo_approval: 88%
italy_legal_entity: Cloudflare Italy S.r.l.
contract_type: Permanent Italian Contract (CCNL Terziario)
remote_policy: Distributed / Remote-First
emea_staff_comp_range: €160,000 - €230,000 + RSU equity
culture_and_wlb:
  summary: High engineering rigor, low bureaucracy, async-heavy culture. Heavy Linux
    kernel tuning, eBPF/XDP, Go and Rust. On-call rotations exist but are generally
    compensated and well-engineered.
  pros:
  - Exceptional technical peer group
  - Pushes boundaries of Linux kernel & networking
  - Strong compensation & equity
  cons:
  - High autonomy expected — little hand-holding
  - Global scope can mean occasional timezone overlap
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background review, location verification (confirming
    Italy S.r.l. eligibility), salary expectations.'
  - '2. Hiring Manager Technical Chat (45m): Deep dive into past projects, Linux kernel/networking
    trade-offs, architectural philosophy.'
  - '3. Coding / Practical Systems (60m): Hands-on coding in Go, C, or Rust. Concurrency,
    memory allocation, network primitives. Not abstract LeetCode tricks — practical
    systems problems.'
  - '4. Systems Architecture & Design (60m): Large-scale distributed edge design (e.g.
    edge proxy caching, DDoS mitigation, rate limiting, consistency models).'
  - '5. Culture & Values (''Cloudflare Capabilities'') (45m): Cross-functional collaboration,
    handling ambiguity, learning mindset.'
