name: Chainguard
tier: Scaleup / Container OS & Supply Chain
glassdoor_rating: 4.7
recommend_to_friend: 94%
ceo_approval: 96%
home_legal_entity: None (hiring in Europe via EOR / Deel / Remote.com)
contract_type: Permanent Employee Contract via EOR
remote_policy: 100% Remote (Americas / Europe)
emea_staff_comp_range: €120,000 - €180,000 + Stock Options
culture_and_wlb:
  summary: Creators of Wolfi Linux (minimal, declarative, undocked container OS) and
    Chainguard Images. Founded by Kubernetes/Go pioneers. Heavy open-source pedigree,
    laser-focused on minimal attack surfaces and secure software supply chains.
  pros:
  - 100% remote-first with mature async communication
  - Direct work on modern Linux distribution engineering in Go
  - Top-tier engineering leadership and rapid industry adoption
  cons:
  - Fast-growing startup pace with shifting team boundaries
  - Strict vulnerability response on-call obligations
interview_process:
  stages:
  - '1. Recruiter Screen (30m): Background, remote workflow, compensation expectations.'
  - '2. Technical Deep Dive (60m): Container runtimes, Linux packaging, Go systems
    programming, supply chain security.'
  - '3. System Design & Architecture (60m): Building resilient distribution pipelines,
    minimal base images, build reproducibility.'
  - '4. Founders & Team Alignment: Cultural fit, remote autonomy, and engineering
    philosophy.'
